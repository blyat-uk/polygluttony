[package]
name = "polygluttony"
version = "1.0.0"
description = "LLM-powered subtitle translation for donghua and anime"
authors = ["n0ks"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "polygluttony_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
tauri-plugin-notification = "2.6.0"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt-multi-thread"] }
futures = "0.3.34"
regex = "1.13.1"
anyhow = "1.0.104"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
async-trait = "0.1"
encoding_rs = "0.8"
chardetng = "1"
tokio-util = "0.7.20"
rand = "0.10.3"
eventsource-stream = "0.2.3"
notify = "8.2.0"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1.53.2", features = ["test-util"] }
